<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>धन्यवाद | Nyay Path</title>
<meta name="description" content="Nyay Path — आपकी enquiry प्राप्त हो गई है।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--gold:#d4af37;--cream:#f6f4ee}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--navy);color:white;font-family:Inter,system-ui,sans-serif;padding:24px}
.card{max-width:620px;width:100%;background:#fff;color:#17233b;border-radius:22px;padding:56px 42px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.mark{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;margin:0 auto 24px;color:#8b6d16;font-size:30px}
h1{font-family:"Noto Serif Devanagari",Georgia,serif;font-size:clamp(30px,6vw,46px);margin:0 0 12px}
p{line-height:1.7;color:#5b6472;margin:0 0 28px}
a{display:inline-flex;padding:13px 24px;border-radius:999px;background:var(--gold);color:var(--navy);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <div class="mark">✓</div>
  <h1>धन्यवाद!</h1>
  <p>आपकी enquiry सफलतापूर्वक प्राप्त हो गई है। हमारी टीम आपकी जानकारी देखकर जल्द आपसे संपर्क करेगी।</p>
  <a href="index.html">वेबसाइट पर वापस जाएँ</a>
</main>
</body>
</html>
